[workspace]
members = [
    "programs/*"
]
resolver = "2"

# Solana version used by `solana-verify build` (verifiable build image).
[workspace.metadata.cli]
solana = "3.1.10"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
