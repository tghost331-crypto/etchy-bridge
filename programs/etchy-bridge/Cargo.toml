[package]
name = "etchy-bridge"
version = "0.1.0"
description = "Etchy Rune bridge: lock vault between Etchy SPL coins and Bitcoin Runes"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "etchy_bridge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2" }
solana-security-txt = "=1.1.3"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
solana-transaction-error = "3"
solana-instruction-error = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
